<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="أوقات الصلاة في سلطنة عُمان" />
  <title>مواقيت الصلاة | عُمان</title>
  <style>
    :root{--bg:#071512;--card:#0d211c;--card2:#102a23;--gold:#d7b56d;--text:#f7f2e7;--muted:#aebdb6;--line:#214238;--accent:#7fc5a9}
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#174437 0,#071512 45%);color:var(--text);min-height:100vh}
    .wrap{width:min(1100px,92%);margin:auto;padding:28px 0 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:24px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
    select,button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}select{min-width:180px}
    .hero{background:linear-gradient(145deg,rgba(20,54,45,.95),rgba(9,29,24,.96));border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 60px #0004;margin-bottom:20px}.label{color:var(--muted);font-size:14px}.next{font-size:34px;color:var(--gold);margin:10px 0}.count{font-size:30px;font-weight:700;letter-spacing:1px}.date{margin-top:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.prayer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 10px;text-align:center;transition:.2s}.prayer:hover{transform:translateY(-3px);border-color:#4c7566}.prayer.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--card2)}.prayer .icon{font-size:23px;margin-bottom:9px}.prayer .name{color:var(--muted);font-size:14px}.prayer .time{font-size:25px;font-weight:700;margin-top:8px}.badge{display:inline-block;margin-top:8px;background:var(--gold);color:#172016;border-radius:999px;padding:3px 9px;font-size:11px}
    .info{margin-top:20px;color:var(--muted);text-align:center;font-size:13px;line-height:1.8}.error{color:#f2a5a5;margin-top:12px}.loading{opacity:.65}
    @media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.next{font-size:28px}.count{font-size:25px}}
    @media(max-width:480px){.wrap{padding-top:18px}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:22px 14px}.brand h1{font-size:19px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="logo">☾</div><div><h1>مواقيت الصلاة</h1><p>سلطنة عُمان</p></div></div>
      <select id="city" aria-label="اختر المدينة">
        <option value="Muscat">مسقط</option><option value="Salalah">صلالة</option><option value="Sohar">صحار</option><option value="Nizwa">نزوى</option><option value="Sur">صور</option><option value="Ibri">عبري</option><option value="Rustaq">الرستاق</option><option value="Buraimi">البريمي</option>
      </select>
    </header>

    <section class="hero">
      <div class="label">الصلاة القادمة</div><div id="next" class="next">جاري التحميل...</div><div id="count" class="count">--:--:--</div><div id="date" class="date"></div><div id="error" class="error"></div>
    </section>

    <section id="prayers" class="grid"></section>
    <p class="info">يتم جلب المواقيت تلقائيًا حسب المدينة والتاريخ الحالي. المواقيت لأغراض إرشادية، ويُفضّل مطابقتها مع تقويم وزارة الأوقاف والشؤون الدينية في عُمان عند الحاجة.</p>
  </main>

  <script>
    const names={Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
    const icons={Fajr:'🌅',Dhuhr:'☀️',Asr:'🌤️',Maghrib:'🌇',Isha:'🌙'};
    let data=null;
    const city=document.getElementById('city');

    async function load(){
      const selected=city.value; document.getElementById('error').textContent='';
      document.getElementById('prayers').innerHTML='<div class="prayer loading">جاري تحميل المواقيت...</div>'.repeat(5);
      try{
        const url=`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(selected)}&country=Oman&method=8`;
        const res=await fetch(url); if(!res.ok) throw new Error('network');
        const json=await res.json(); data=json.data;
        render();
      }catch(e){document.getElementById('error').textContent='تعذر تحميل المواقيت. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.';document.getElementById('prayers').innerHTML='';}
    }

    function render(){
      const t=data.timings; const keys=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
      document.getElementById('date').textContent=`${data.date.gregorian.weekday.en} • ${data.date.gregorian.date} • ${data.date.hijri.date} هـ`;
      document.getElementById('prayers').innerHTML=keys.map(k=>`<article class="prayer" id="p-${k}"><div class="icon">${icons[k]}</div><div class="name">${names[k]}</div><div class="time">${t[k].slice(0,5)}</div></article>`).join('');
      tick();
    }

    function parseTime(s){const [h,m]=s.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d}
    function tick(){if(!data)return;const keys=['Fajr','Dhuhr','Asr','Maghrib','Isha'];const now=new Date();let nextKey=null,nextDate=null;
      for(const k of keys){const d=parseTime(data.timings[k]);if(d>now){nextKey=k;nextDate=d;break}}
      if(!nextDate){nextKey='Fajr';nextDate=parseTime(data.timings.Fajr);nextDate.setDate(nextDate.getDate()+1)}
      document.querySelectorAll('.prayer').forEach(x=>x.classList.remove('active'));const el=document.getElementById('p-'+nextKey);if(el){el.classList.add('active');el.insertAdjacentHTML('beforeend','<span class="badge">القادمة</span>')}
      document.getElementById('next').textContent=names[nextKey];
      const diff=Math.max(0,nextDate-now), sec=Math.floor(diff/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
      document.getElementById('count').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    city.addEventListener('change',load); load(); setInterval(tick,1000);
  </script>
</body>
</html>
